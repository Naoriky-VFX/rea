name: sync upstream

on:
  schedule:
    - cron: "25 6 * * *"   # 03:$Minuto de BrasÃ­lia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trazer o repositÃ³rio original
        run: |
          set -e
          git config user.name "sync-bot"
          git config user.email "sync@users.noreply.github.com"
          git remote add upstream https://github.com/morluto/rea.git || true
          git fetch --depth=50 upstream main
          git checkout main
          if git merge --ff-only upstream/main; then
            git push origin main
            echo "Fork atualizado com o original (morluto/rea)."
          else
            echo "::warning::O fork tem mudanÃ§as prÃ³prias; nÃ£o deu para avanÃ§ar sem conflito. Nada foi alterado."
          fi
